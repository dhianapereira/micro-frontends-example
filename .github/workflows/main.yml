name: Main

on:
  push:
    branches:
      - main
    # Main should validate code entering the branch. Coverage badge updates and
    # documentation-only changes do not need to start another coverage cycle.
    paths:
      - "base_app/**/*.dart"
      - "base_app/pubspec.yaml"
      - "base_app/analysis_options.yaml"
      - "micro_apps/**/*.dart"
      - "micro_apps/**/*.arb"
      - "micro_apps/**/l10n.yaml"
      - "micro_apps/**/pubspec.yaml"
      - "micro_apps/**/analysis_options.yaml"
      - "packages/**/*.dart"
      - "packages/**/pubspec.yaml"
      - "packages/**/analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-coverage:
    name: Test and update coverage
    runs-on: ubuntu-latest
    # Extra guard for squash/merge commits created from the automated badge PR.
    if: ${{ !contains(github.event.head_commit.message, 'docs: update coverage badge') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: ./.github/actions/setup-flutter

      - name: Run all tests with coverage
        run: |
          # Main validates the whole workspace, unlike pull requests where Melos
          # filters by diff.
          dart run melos exec -c 1 --fail-fast \
            --dir-exists=test \
            -- flutter test --coverage --no-pub

      - name: Update coverage badge
        shell: bash
        run: tool/ci/update_coverage_badge.sh

      - name: Create coverage badge pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/update-coverage-badge
          delete-branch: true
          commit-message: "docs: update coverage badge"
          title: "docs: update coverage badge"
          body: |
            Updates the README coverage badge from the latest successful run on main.

            This PR is created automatically by the main CI workflow.
          labels: ci, documentation
