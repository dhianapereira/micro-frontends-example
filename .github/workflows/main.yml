name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-coverage:
    name: Test and update coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: ./.github/actions/setup-flutter

      - name: Run all tests with coverage
        run: |
          # Main validates the whole workspace, unlike pull requests where Melos
          # filters by diff.
          dart run melos exec -c 1 --fail-fast \
            --dir-exists=test \
            -- flutter test --coverage --no-pub

      - name: Update coverage badge
        shell: bash
        run: tool/ci/update_coverage_badge.sh

      - name: Create coverage badge pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/update-coverage-badge
          delete-branch: true
          commit-message: "docs: update coverage badge"
          title: "docs: update coverage badge"
          body: |
            Updates the README coverage badge from the latest successful run on main.

            This PR is created automatically by the main CI workflow.
          labels: ci, documentation
