name: Pull Request

on:
  pull_request:
    branches:
      - main
    # Ignore documentation-only or non-Dart script changes at the trigger level.
    # Package selection still happens with Melos inside each job.
    paths:
      - "base_app/**/*.dart"
      - "base_app/pubspec.yaml"
      - "base_app/analysis_options.yaml"
      - "micro_apps/**/*.dart"
      - "micro_apps/**/*.arb"
      - "micro_apps/**/l10n.yaml"
      - "micro_apps/**/pubspec.yaml"
      - "micro_apps/**/analysis_options.yaml"
      - "packages/**/*.dart"
      - "packages/**/pubspec.yaml"
      - "packages/**/analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint affected packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Melos --diff needs the base branch history.
          fetch-depth: 0

      - name: Setup Flutter Environment
        uses: ./.github/actions/setup-flutter

      - name: Analyze affected packages
        run: |
          # Root workspace files can affect every package, so they trigger a
          # full workspace analysis. Otherwise, Melos selects changed packages
          # and their dependents from the PR diff.
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- \
            pubspec.yaml \
            pubspec.lock \
            analysis_options.yaml | grep -q .; then
            dart run melos exec -c 1 --fail-fast -- flutter analyze --no-pub
          else
            dart run melos exec -c 1 --fail-fast \
              --diff="origin/${{ github.base_ref }}...HEAD" \
              --include-dependents \
              -- flutter analyze --no-pub
          fi

  test:
    name: Test affected packages
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Melos --diff needs the base branch history.
          fetch-depth: 0

      - name: Setup Flutter Environment
        uses: ./.github/actions/setup-flutter

      - name: Test affected packages
        run: |
          # Test only packages that have a test directory. Root workspace files
          # trigger all package tests because dependency resolution or analysis
          # options can affect the whole monorepo.
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- \
            pubspec.yaml \
            pubspec.lock \
            analysis_options.yaml | grep -q .; then
            dart run melos exec -c 1 --fail-fast \
              --dir-exists=test \
              -- flutter test --no-pub
          else
            dart run melos exec -c 1 --fail-fast \
              --diff="origin/${{ github.base_ref }}...HEAD" \
              --include-dependents \
              --dir-exists=test \
              -- flutter test --no-pub
          fi
