name: base_app
description: "The package responsible for initializing the application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  event_bus:
    path: ../packages/event_bus
  foundations:
    path: ../packages/foundations
  navigation:
    path: ../packages/navigation
  micro_app_login:
    path: ../micro_apps/micro_app_login
  micro_app_home:
    path: ../micro_apps/micro_app_home

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
